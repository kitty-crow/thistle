name: Test dependency update

on:
  repository_dispatch:
    types: [dependency-updated]
  workflow_dispatch:
    inputs:
      dependency:
        description: Dependency name from project.dependencies.json
        required: true
      revision:
        description: Exact commit to test
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-${{ github.event.client_payload.dependency || inputs.dependency }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Validate dependency compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Select dependency revision
        env:
          DEPENDENCY: ${{ github.event.client_payload.dependency || inputs.dependency }}
          REVISION: ${{ github.event.client_payload.new_commit || inputs.revision }}
        run: scripts/update-dependency.sh "$DEPENDENCY" "$REVISION"
      - name: Install dependencies
        run: bun install
      - name: Strict Code Guards
        run: bun run guards

      - name: Type-check kernel
        if: ${{ success() || failure() }}
        run: bun run check

      - name: Test kernel memory
        if: ${{ success() || failure() }}
        run: bun run test:memory

      - name: Test native numeric operations
        if: ${{ success() || failure() }}
        run: bun run test:numeric

      - name: Test native VFS syscalls
        if: ${{ success() || failure() }}
        run: bun run test:vfs

      - name: Test host capability boundaries
        if: ${{ success() || failure() }}
        run: bun run test:host
      - name: Open or update approval-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY: ${{ github.event.client_payload.dependency || inputs.dependency }}
          REVISION: ${{ github.event.client_payload.new_commit || inputs.revision }}
        run: scripts/open-dependency-pr.sh "$DEPENDENCY" "$REVISION"
